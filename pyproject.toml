[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tdm"
version = "0.1.0"
description = "Internal lib"
requires-python = ">=3.12,<3.13"

dependencies = [
    "pyloid",
    "openpyxl>=3.1",
    "selenium==4.46.0",
    "pywin32",
    "python-dateutil",
    "beautifulsoup4",
    "requests",
    "cryptography>=42.0.0",
]

[dependency-groups]
dev = [
    "pyloid-builder",
    "pyloid-watcher",
    "pytest>=8",
    "ruff",
]

[tool.setuptools.packages.find]
include = ["tdm*"]
